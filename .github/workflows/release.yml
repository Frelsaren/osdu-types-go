# Creates a new semver tag and GitHub release whenever a change lands on main.
# Default bump is patch. Include "#minor" or "#major" in the merge commit
# message (e.g. the PR title) to bump the minor or major version instead.

name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD already tagged, skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"

          if grep -qi '#major' <<< "$COMMIT_MSG"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qi '#minor' <<< "$COMMIT_MSG"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          next="v${major}.${minor}.${patch}"
          echo "Latest: $latest -> Next: $next"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "$NEXT"

          args=(--title "$NEXT" --generate-notes)
          if [ "$PREVIOUS" != "v0.0.0" ]; then
            args+=(--notes-start-tag "$PREVIOUS")
          fi
          gh release create "$NEXT" "${args[@]}"
